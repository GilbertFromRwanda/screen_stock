<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline - GilStock</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6fa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        color: #103060;
        padding: 24px;
    }
    .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(16,48,96,0.12);
        padding: 40px 32px;
        max-width: 380px;
        text-align: center;
    }
    .icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #103060;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        margin: 0 auto 20px;
    }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { font-size: 14px; color: #55617a; margin: 0 0 24px; line-height: 1.5; }
    button {
        background: #103060;
        color: #fff;
        border: none;
        padding: 11px 22px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover { background: #0a2148; }
</style>
</head>
<body>
    <div class="card">
        <div class="icon">GS</div>
        <h1>You're offline</h1>
        <p>GilStock needs a connection to load your stock, sales and loan data. Reconnect and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
